name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  release-contracts:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependency-light test tools
        run: python -m pip install 'pytest>=8,<9' 'ruff>=0.12,<1'
      - name: Root regression suite
        run: python -m pytest -q
      - name: Lint original integration code
        run: ruff check tools tests
      - name: Compile all shipped Python source
        run: python -m compileall -q tools tests custom_nodes
      - name: Verify generated API graphs
        run: python tools/generate_api_examples.py --check
      - name: Verify generated UI workflows
        run: python tools/generate_ui_examples.py --check
      - name: Public-content and runtime-asset gate
        run: python tools/check_public_content.py

  component-cpu-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: Install CPU component-test dependencies
        run: |
          python -m pip install 'pytest>=8,<9' numpy
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Spectrum CPU tests
        run: python -m pytest -q custom_nodes/ComfyUI-Spectrum-MiniMax-H3/tests
      - name: FirstBlockCache dependency-light cache tests
        run: python custom_nodes/ComfyUI-MiniMaxH3-FirstBlockCache/tests/test_cache.py
